# Deployment configuration for CEO2828/BlindSpot.
# Add secret values through DigitalOcean's encrypted environment settings.
name: blindspot
region: nyc
services:
  - name: web
    github:
      repo: CEO2828/BlindSpot
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    envs:
      - key: MONGODB_DB
        value: blindspot
        scope: RUN_TIME
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web
